<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><title>俄羅斯羅盤 · 小遊戲樂園</title><link rel="stylesheet" href="compass.css"></head>
<body><main>
<header><span class="compass-icon" aria-hidden="true">✦</span><div><span class="eyebrow">LITTLE GAMES / SIX SEATS</span><h1>俄羅斯羅盤</h1></div></header>
<section id="entry" class="panel"><p>六人線上推理對決。用瀏覽器開房或加入，不需安裝。</p><label>暱稱<input id="nickname" maxlength="16" autocomplete="off" placeholder="輸入你的暱稱"></label><button id="create" class="accent">建立房間</button><label>房間代碼<input id="code" maxlength="8" autocapitalize="characters" autocomplete="off" placeholder="8 碼房間代碼"></label><button id="join">加入房間</button></section>
<section id="room" hidden>
<div class="panel top"><div><small>房間代碼</small><strong id="room-code"></strong></div><button id="copy">複製代碼</button><button id="invite">複製邀請連結</button></div>
<div class="panel"><div class="top"><h2 id="phase">等候玩家</h2><span id="points"></span></div><p id="turn"></p><ol id="seats" aria-label="六個座位"></ol><div class="buttons"><button class="accent" id="start" hidden>六人開局</button><button id="leave" hidden>離開房間</button></div></div>
<section class="panel" id="actions" hidden><div class="top"><h2>選擇行動</h2><small id="pool"></small></div><label>行動<select id="kind"><option value="open">公開調查 · 1 點</option><option value="private">私下調查 · 2 點</option><option value="rotate1">順轉一格 · 3 點</option><option value="rotate2">順轉兩格 · 4 點</option><option value="swap">秘密交換 · 每次投 1～3 點</option></select></label><label id="amount-wrap" hidden>投入點數<select id="amount"><option>1</option><option>2</option><option>3</option></select></label><label id="pair-wrap">順時針相鄰兩格<select id="pair"></select></label><button class="accent" id="move">確認行動</button></section>
<section class="panel" id="history" hidden><h2>只有你看得到</h2><ul id="notes"></ul><h2>公開紀錄</h2><ul id="events"></ul></section>
</section>
<p id="status" role="status" aria-live="polite"></p>
<details class="panel"><summary>玩法說明</summary><p>六格中藏著兩個淘汰標記。每人有 16 點，先手每輪順移一位。調查相鄰兩格、轉動或交換，推理標記的位置。</p><p>秘密交換可由多人投入；公共累積達 6 點時，最後投入的人秘密交換相鄰兩格，超額作廢。點數用光會自動跳過；第三人用光時立即結算，標記對應的兩人淘汰，其他人各得 1 枚籌碼。</p></details>
</main><script src="compass.js"></script></body></html>
